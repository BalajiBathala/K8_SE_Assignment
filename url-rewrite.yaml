apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: url-rewrite-route

spec:

  parentRefs:
    - name: company-gateway

  hostnames:
    - web.company.local
    - api.company.local
    - test.company.local


  rules:


    # NGINX
    - matches:
        - path:
            type: PathPrefix
            value: /web

      filters:

        - type: URLRewrite
          urlRewrite:

            path:

              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:

        - name: nginx-service
          port: 80



    # HTTPBIN
    - matches:
        - path:
            type: PathPrefix
            value: /api

      filters:

        - type: URLRewrite
          urlRewrite:

            path:

              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:

        - name: httpbin-service
          port: 80



    # ECHOSERVER
    - matches:
        - path:
            type: PathPrefix
            value: /test

      filters:

        - type: URLRewrite
          urlRewrite:

            path:

              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:

        - name: echoserver-service
          port: 80
