apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: request-timeout-route

spec:

  parentRefs:
    - name: company-gateway

  hostnames:
    - web.company.local
    - api.company.local
    - test.company.local


  rules:


    # NGINX TIMEOUT
    - matches:

        - path:
            type: PathPrefix
            value: /web


      backendRefs:

        - name: nginx-service
          port: 80


      timeouts:

        request: 10s




    # HTTPBIN TIMEOUT
    - matches:

        - path:
            type: PathPrefix
            value: /api


      backendRefs:

        - name: httpbin-service
          port: 80


      timeouts:

        request: 10s




    # ECHOSERVER TIMEOUT
    - matches:

        - path:
            type: PathPrefix
            value: /test


      backendRefs:

        - name: echoserver-service
          port: 80


      timeouts:

        request: 10s
